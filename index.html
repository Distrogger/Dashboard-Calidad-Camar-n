<script>
        function openTab(evt, tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
            if(tabName === 'tab1') renderDashboard(); 
        }

        let db = { liquidaciones: [], sabores: [], metabisulfito: [], consolidado: [] };
        let charts = {};

        // Limpiador agresivo de números
        function parseNum(val) {
            if (typeof val === 'number') return val;
            if (!val || val.toString().trim() === '') return 0;
            let cleanVal = val.toString().replace(/,/g, '').replace(/"/g, '').trim();
            return parseFloat(cleanVal) || 0;
        }

        function getCamaroneraOficial(piscina, camaroneraOriginal) {
            let orig = (camaroneraOriginal || "Desconocida").trim();
            if (!piscina) return orig;
            piscina = piscina.toString().trim().toUpperCase();
            if (piscina.startsWith("PU") && piscina.length >= 3) {
                return "Puerto Inca " + piscina.charAt(2);
            } else if (piscina.startsWith("PD")) {
                return "Puna 2";
            } else if (piscina.startsWith("PT")) {
                return "Taura";
            }
            return orig;
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            let files = e.target.files;
            let loaded = 0;
            Array.from(files).forEach(file => {
                let name = file.name.toLowerCase();
                // DETECCIÓN INTELIGENTE DE DELIMITADOR (CORRIGE EL ERROR DE MILES)
                let delim = name.includes('omiprod') ? ';' : ','; 
                
                Papa.parse(file, {
                    header: true, 
                    dynamicTyping: false, 
                    skipEmptyLines: true,
                    delimiter: delim,
                    complete: function(results) {
                        if(name.includes('omiprod')) db.liquidaciones = results.data;
                        else if(name.includes('sabor')) db.sabores = results.data;
                        else if(name.includes('metabisulfito')) db.metabisulfito = results.data;
                        
                        loaded++;
                        if(loaded === files.length) initProcesamiento();
                    }
                });
            });
        });

        async function fetchInitialData() {
            try {
                const files = [
                    { key: 'liquidaciones', path: './OMIPROD0016_tblControlDeLotesTmp.csv', delim: ';' },
                    { key: 'sabores', path: './Sabor_Desglosado_Validado.csv', delim: ',' },
                    { key: 'metabisulfito', path: './Metabisulfito_Validado.csv', delim: ',' }
                ];
                let allLoaded = true;
                for (let f of files) {
                    let res = await fetch(f.path);
                    if (!res.ok) { allLoaded = false; break; }
                    let text = await res.text();
                    let parsed = Papa.parse(text, { 
                        header: true, 
                        dynamicTyping: false, 
                        skipEmptyLines: true,
                        delimiter: f.delim // SE FUERZA EL DELIMITADOR CORRECTO
                    });
                    db[f.key] = parsed.data;
                }
                
                if(allLoaded && db.liquidaciones.length > 0) {
                    initProcesamiento();
                } else {
                    document.getElementById('status-indicator').textContent = "Usa el botón para cargar CSVs locales";
                }
            } catch (e) {
                document.getElementById('status-indicator').textContent = "Carga los CSVs manualmente";
            }
        }

        function initProcesamiento() {
            document.getElementById('status-indicator').textContent = "Procesando Datos...";
            document.getElementById('status-indicator').className = "text-xs font-semibold px-3 py-1 bg-blue-100 text-blue-800 rounded-full";
            
            let lotesMap = new Map();
            let camaronerasSet = new Set();

            // 1. OMIPROD0016
            db.liquidaciones.forEach(row => {
                let lote = (row['Lote'] || '').toString().trim();
                if(!lote) return;
                
                if(!lotesMap.has(lote)) {
                    lotesMap.set(lote, {
                        Lote: lote,
                        Camaronera_Oficial: "Desconocida",
                        Piscina: "",
                        Libras_Recibidas: parseNum(row['Libras Recibidas']),
                        Libras_Procesadas: parseNum(row['Libras Procesadas']),
                        Basura: parseNum(row['Basura']),
                        Rechazo: parseNum(row['Rechazo']),
                        Gramaje_OC: parseNum(row['Gramaje OC']),
                        Valor_Total: 0,
                        Clases: { A: 0, B: 0, C: 0, D: 0 }
                    });
                }
                let l = lotesMap.get(lote);
                l.Valor_Total += parseNum(row['Valor Total $']);
                
                let librasFilas = parseNum(row['Libras Totales']);
                let claseStr = (row['Clase'] || "").toString().toUpperCase().trim();
                
                if(claseStr === 'A') l.Clases.A += librasFilas;
                else if(claseStr === 'B') l.Clases.B += librasFilas;
                else if(claseStr === 'C') l.Clases.C += librasFilas;
                else if(claseStr === 'D') l.Clases.D += librasFilas;
            });

            // 2. Metabisulfito
            let metaTemp = {};
            db.metabisulfito.forEach(row => {
                let lote = (row['Lote'] || '').toString().trim();
                if(!lote) return;
                if(!metaTemp[lote]) metaTemp[lote] = { totalLbs: 0, frescoSuma: 0, metaSuma: 0, manchaL: 0, manchaF: 0, bactL: 0 };
                
                let lbs = parseNum(row['Libras recibidas']);
                metaTemp[lote].totalLbs += lbs;
                metaTemp[lote].frescoSuma += parseNum(row['E. fresco y sano (%)']) * lbs;
                metaTemp[lote].metaSuma += parseNum(row['Porcentaje de metabisulfito']) * lbs;
                metaTemp[lote].manchaL += parseNum(row['E. mancha leve (%)']) * lbs;
                metaTemp[lote].manchaF += parseNum(row['E. mancha fuerte (%)']) * lbs;
                metaTemp[lote].bactL += parseNum(row['E. hongo/bacteria leve (%)']) * lbs;
            });

            // 3. Sabores y Finalización
            db.sabores.forEach(row => {
                let lote = (row['Lote'] || '').toString().trim();
                if(lotesMap.has(lote)) {
                    let l = lotesMap.get(lote);
                    l.Proveedor = (row['Proveedor'] || "Desconocido").trim();
                    l.Piscina = (row['Piscina'] || "").trim();
                    l.Camaronera_Oficial = getCamaroneraOficial(l.Piscina, row['Camaronera']);
                    camaronerasSet.add(l.Camaronera_Oficial);
                    
                    l.Sabor_Caract = parseNum(row['Sabor caracteristico %']);
                    l.Tierra_L = parseNum(row['Sabor tierra entero leve %']);
                    l.Tierra_F = parseNum(row['Sabor tierra entero fuerte %']);
                    l.Tierra_Max = l.Tierra_L + l.Tierra_F;
                    l.Diesel = parseNum(row['Sabor combustible entero fuerte %']) + parseNum(row['Sabor combustible cola fuerte %']);
                }
            });

            Array.from(lotesMap.values()).forEach(l => {
                let lote = l.Lote;
                if(metaTemp[lote] && metaTemp[lote].totalLbs > 0) {
                    l.Perc_Fresco = metaTemp[lote].frescoSuma / metaTemp[lote].totalLbs;
                    l.Perc_Meta = metaTemp[lote].metaSuma / metaTemp[lote].totalLbs;
                    l.Mancha_Leve = metaTemp[lote].manchaL / metaTemp[lote].totalLbs;
                    l.Mancha_Fuerte = metaTemp[lote].manchaF / metaTemp[lote].totalLbs;
                    l.Bact_Leve = metaTemp[lote].bactL / metaTemp[lote].totalLbs;
                } else {
                    l.Perc_Fresco = 0; l.Perc_Meta = 0; l.Mancha_Leve = 0; l.Mancha_Fuerte = 0; l.Bact_Leve = 0;
                }
                
                let maxLbs = 0;
                let cValida = "-";
                if(l.Clases.A > maxLbs) { cValida = 'A'; maxLbs = l.Clases.A; }
                if(l.Clases.B > maxLbs) { cValida = 'B'; maxLbs = l.Clases.B; }
                if(l.Clases.C > maxLbs) { cValida = 'C'; maxLbs = l.Clases.C; }
                if(l.Clases.D > maxLbs) { cValida = 'D'; maxLbs = l.Clases.D; }
                
                l.Clase_Valida = (l.Diesel > 0) ? 'D' : cValida;
            });

            db.consolidado = Array.from(lotesMap.values());
            
            // Poblar Filtros
            let camSelect = document.getElementById('filterCamaronera');
            camSelect.innerHTML = '<option value="ALL">Todas</option>';
            Array.from(camaronerasSet).sort().forEach(c => {
                 let opt = document.createElement('option');
                 opt.value = c; opt.innerHTML = c;
                 camSelect.appendChild(opt);
            });

            renderDashboard();
            document.getElementById('status-indicator').textContent = "Dashboard Actualizado";
            document.getElementById('status-indicator').className = "text-xs font-semibold px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full";
        }

        function createChart(id, config) {
            if(charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), config);
        }

        function getFilteredData() {
            let filterCam = document.getElementById('filterCamaronera').value;
            let filterClase = document.getElementById('filterClase').value;
            
            return db.consolidado.filter(d => {
                let matchCam = filterCam === 'ALL' || d.Camaronera_Oficial === filterCam;
                let matchClase = filterClase === 'ALL' || d.Clase_Valida === filterClase;
                return matchCam && matchClase;
            });
        }

        function renderDashboard() {
            const data = getFilteredData();
            
            // TÓTALES
            let totalRecibidas = data.reduce((a,b)=>a+b.Libras_Recibidas, 0);
            let totalProcesadas = data.reduce((a,b)=>a+b.Libras_Procesadas, 0);
            let totalRechazo = data.reduce((a,b)=>a+b.Rechazo, 0);
            let totalBasura = data.reduce((a,b)=>a+b.Basura, 0);
            let totalClaseA = data.reduce((a,b)=>a+b.Clases.A, 0);
            let totalValor = data.reduce((a,b)=>a+b.Valor_Total, 0);
            let totalClaseB = data.reduce((a,b)=>a+b.Clases.B, 0);
            let totalClaseC = data.reduce((a,b)=>a+b.Clases.C, 0);
            
            let rndIndustrial = totalRecibidas > 0 ? (totalProcesadas/totalRecibidas)*100 : 0;
            let dowRechazo = totalProcesadas > 0 ? (totalRechazo/totalProcesadas)*100 : 0;
            let recPremium = totalProcesadas > 0 ? (totalClaseA/totalProcesadas)*100 : 0;

            document.getElementById('kpi-rendimiento').innerText = rndIndustrial.toFixed(1) + "%";
            document.getElementById('kpi-rechazo').innerText = dowRechazo.toFixed(1) + "%";
            document.getElementById('kpi-rechazo-sub').innerText = totalRechazo.toLocaleString('en-US', {maximumFractionDigits:0}) + " lbs desviadas";
            document.getElementById('kpi-premium').innerText = recPremium.toFixed(1) + "%";
            document.getElementById('kpi-premium-sub').innerText = totalClaseA.toLocaleString('en-US', {maximumFractionDigits:0}) + " lbs";
            document.getElementById('kpi-procesadas').innerText = totalProcesadas.toLocaleString('en-US', {maximumFractionDigits:0});
            document.getElementById('kpi-valor').innerText = "Valor Liq: $" + totalValor.toLocaleString('en-US', {maximumFractionDigits:0});

            // GRÁFICA 1: CASCADA PORCENTUAL CON TOOLTIP NUMÉRICO
            let baseCascada = totalRecibidas > 0 ? totalRecibidas : 1;
            let pctBasura = (totalBasura / baseCascada) * 100;
            let pctProcesadas = (totalProcesadas / baseCascada) * 100;
            let pctRechazo = (totalRechazo / baseCascada) * 100;
            let pctEntero = pctProcesadas - pctRechazo;
            let valArray = [totalRecibidas, -totalBasura, totalProcesadas, -totalRechazo, totalProcesadas - totalRechazo];

            createChart('chartWaterfall', {
                type: 'bar',
                data: {
                    labels: ['1. Recibidas', '2. Merma/Basura', '3. Procesadas', '4. Desvío Cola', '5. Entero Final'],
                    datasets: [{
                        label: '% del Lote',
                        data: [100, -pctBasura, pctProcesadas, -pctRechazo, pctEntero],
                        backgroundColor: ['#94a3b8', '#fecdd3', '#3b82f6', '#f59e0b', '#10b981'],
                        borderRadius: 4
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: { 
                            callbacks: { 
                                label: (ctx) => {
                                    let pct = Math.abs(ctx.raw).toFixed(2) + '%';
                                    let val = Math.abs(valArray[ctx.dataIndex]).toLocaleString('en-US', {maximumFractionDigits:0}) + ' lbs';
                                    return `${pct} (${val})`;
                                }
                            } 
                        }
                    },
                    scales: { y: { suggestedMin: -10, suggestedMax: 100 } }
                }
            });

            // GRÁFICA 2: DIAGRAMA DE PASTEL
            createChart('chartPie', {
                type: 'pie',
                data: {
                    labels: ['Clase A', 'Clase B', 'Clase C'],
                    datasets: [{
                        data: [totalClaseA, totalClaseB, totalClaseC],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    let value = context.raw;
                                    let total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    let percentage = total > 0 ? ((value / total) * 100).toFixed(1) + '%' : '0%';
                                    return `${label}: ${percentage} (${value.toLocaleString()} lbs)`;
                                }
                            }
                        }
                    }
                }
            });

            // GRÁFICA 3: BARRAS APILADAS POR CAMARONERA (DISPOSICIÓN 100%)
            let provDisp = {};
            data.forEach(d => {
                let p = d.Camaronera_Oficial;
                if(!provDisp[p]) provDisp[p] = { lbsRecibidas:0, a:0, b:0, c:0, d:0, rechazo:0, basura:0 };
                provDisp[p].lbsRecibidas += d.Libras_Recibidas;
                provDisp[p].a += d.Clases.A;
                provDisp[p].b += d.Clases.B;
                provDisp[p].c += d.Clases.C;
                provDisp[p].d += d.Clases.D;
                provDisp[p].rechazo += d.Rechazo;
                provDisp[p].basura += d.Basura;
            });

            let camLabels = [];
            let dataA = [], dataB = [], dataC = [], dataRech = [], dataBas = [], rawValues = {a:[], b:[], c:[], rech:[], bas:[]};

            Object.keys(provDisp).sort().forEach(k => {
                let o = provDisp[k];
                if(o.lbsRecibidas > 0) {
                    camLabels.push(k);
                    dataA.push((o.a / o.lbsRecibidas) * 100); rawValues.a.push(o.a);
                    dataB.push((o.b / o.lbsRecibidas) * 100); rawValues.b.push(o.b);
                    dataC.push((o.c / o.lbsRecibidas) * 100); rawValues.c.push(o.c);
                    dataRech.push((o.rechazo / o.lbsRecibidas) * 100); rawValues.rech.push(o.rechazo);
                    dataBas.push((o.basura / o.lbsRecibidas) * 100); rawValues.bas.push(o.basura);
                }
            });

            createChart('chartStackedBarCamaroneras', {
                type: 'bar',
                data: {
                    labels: camLabels,
                    datasets: [
                        { label: 'Clase A', data: dataA, backgroundColor: '#10b981', rawData: rawValues.a },
                        { label: 'Clase B', data: dataB, backgroundColor: '#f59e0b', rawData: rawValues.b },
                        { label: 'Clase C', data: dataC, backgroundColor: '#ef4444', rawData: rawValues.c },
                        { label: 'Rechazo a Cola', data: dataRech, backgroundColor: '#1e293b', rawData: rawValues.rech },
                        { label: 'Merma/Basura', data: dataBas, backgroundColor: '#94a3b8', rawData: rawValues.bas }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { x: { stacked: true }, y: { stacked: true, max: 100, title: {display: true, text: '% de Libras Recibidas'} } },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    let pct = ctx.raw.toFixed(1) + '%';
                                    let val = ctx.dataset.rawData[ctx.dataIndex].toLocaleString('en-US', {maximumFractionDigits:0}) + ' lbs';
                                    return `${ctx.dataset.label}: ${pct} (${val})`;
                                }
                            }
                        }
                    }
                }
            });

            // TABLAS MATRIZ Y MAPA DE CALOR
            let cls = { A:{lbs:0}, B:{lbs:0}, C:{lbs:0}, D:{lbs:0} };
            data.forEach(d => {
                if(d.Clase_Valida === 'A') cls.A.lbs += d.Libras_Procesadas;
                if(d.Clase_Valida === 'B') cls.B.lbs += d.Libras_Procesadas;
                if(d.Clase_Valida === 'C') cls.C.lbs += d.Libras_Procesadas;
                if(d.Clase_Valida === 'D') cls.D.lbs += d.Libras_Procesadas;
            });
            let totValidas = cls.A.lbs + cls.B.lbs + cls.C.lbs + cls.D.lbs || 1;

            document.getElementById('tbody-matriz').innerHTML = `
                <tr>
                    <td class="font-bold text-emerald-600">CLASE A</td>
                    <td>60 - 100%</td>
                    <td>Normal / TML &le; 20%</td>
                    <td>ML &le; 3% | MF &lt; 5%</td>
                    <td>&lt; 13%</td>
                    <td class="font-bold text-emerald-700">${cls.A.lbs.toLocaleString('en-US',{maximumFractionDigits:0})} lb (${((cls.A.lbs/totValidas)*100).toFixed(1)}%)</td>
                </tr>
                <tr class="bg-amber-50/30">
                    <td class="font-bold text-amber-600">CLASE B</td>
                    <td>46 - 59%</td>
                    <td>TL &lt; 47% | TML &lt; 27%</td>
                    <td>ML 4-8% | MF 5%</td>
                    <td>14 - 20%</td>
                    <td class="font-bold text-amber-600">${cls.B.lbs.toLocaleString('en-US',{maximumFractionDigits:0})} lb (${((cls.B.lbs/totValidas)*100).toFixed(1)}%)</td>
                </tr>
                <tr class="bg-rose-50/30">
                    <td class="font-bold text-rose-600">CLASE C</td>
                    <td>&le; 45%</td>
                    <td>Excede límites B</td>
                    <td>ML &ge; 9% | MF &gt; 5%</td>
                    <td>&gt; 20%</td>
                    <td class="font-bold text-rose-600">${cls.C.lbs.toLocaleString('en-US',{maximumFractionDigits:0})} lb (${((cls.C.lbs/totValidas)*100).toFixed(1)}%)</td>
                </tr>
                <tr class="bg-slate-100">
                    <td class="font-bold text-slate-800">CLASE D</td>
                    <td colspan="4" class="text-rose-600 font-semibold text-center">Presencia de Sabor Combustible / Diesel</td>
                    <td class="font-bold text-slate-700">${cls.D.lbs.toLocaleString('en-US',{maximumFractionDigits:0})} lb (${((cls.D.lbs/totValidas)*100).toFixed(1)}%)</td>
                </tr>
            `;

            let piscinas = {};
            data.forEach(d => {
                if(!d.Piscina) return;
                let k = d.Camaronera_Oficial + '|' + d.Piscina;
                if(!piscinas[k]) piscinas[k] = { cam: d.Camaronera_Oficial, pis: d.Piscina, lbs:0, frescoS:0, tieMax:0, manLFS:0, bacS:0, lbsA:0 };
                piscinas[k].lbs += d.Libras_Procesadas;
                piscinas[k].frescoS += (d.Perc_Fresco * d.Libras_Procesadas);
                piscinas[k].tieMax = Math.max(piscinas[k].tieMax, (d.Tierra_Max || 0));
                piscinas[k].manLFS += ((d.Mancha_Leve + d.Mancha_Fuerte) * d.Libras_Procesadas);
                piscinas[k].bacS += (d.Bact_Leve * d.Libras_Procesadas);
                piscinas[k].lbsA += d.Clases.A;
            });
            
            let arrPiscinas = Object.values(piscinas).sort((a,b)=> b.lbs - a.lbs);
            document.getElementById('tbody-calor').innerHTML = arrPiscinas.map(p => {
                let fr = p.lbs > 0 ? p.frescoS / p.lbs : 0;
                let mlf = p.lbs > 0 ? p.manLFS / p.lbs : 0;
                let bac = p.lbs > 0 ? p.bacS / p.lbs : 0;
                let pA = p.lbs > 0 ? (p.lbsA / p.lbs) * 100 : 0;
                
                let badgeFr = fr >= 60 ? 'badge-green' : (fr >= 46 ? 'badge-yellow' : 'badge-red');
                let colorA = pA >= 50 ? 'text-emerald-600' : (pA >= 20 ? 'text-amber-600' : 'text-rose-600');
                
                return `<tr>
                    <td class="font-semibold">${p.cam}</td>
                    <td>${p.pis}</td>
                    <td class="font-mono">${p.lbs.toLocaleString('en-US',{maximumFractionDigits:0})}</td>
                    <td><span class="${badgeFr}">${fr.toFixed(1)}%</span></td>
                    <td>${p.tieMax.toFixed(1)}%</td>
                    <td>${mlf.toFixed(1)}%</td>
                    <td>${bac.toFixed(1)}%</td>
                    <td class="font-bold ${colorA}">${pA.toFixed(1)}%</td>
                </tr>`;
            }).join('');

            // PESTAÑA 3: RANKING
            let provs = {};
            data.forEach(d => {
                let p = d.Camaronera_Oficial || "Desconocida";
                if(!provs[p]) provs[p] = { lotes:0, lbsProc:0, fSum:0, a:0, b:0, c:0, rej:0 };
                provs[p].lotes++;
                provs[p].lbsProc += d.Libras_Procesadas;
                provs[p].fSum += (d.Perc_Fresco * d.Libras_Procesadas);
                provs[p].a += d.Clases.A; 
                provs[p].b += d.Clases.B; 
                provs[p].c += d.Clases.C;
                provs[p].rej += d.Rechazo;
            });
            
            let rankArr = Object.keys(provs).map(k => {
                let o = provs[k];
                let pa = o.lbsProc > 0 ? (o.a / o.lbsProc) * 100 : 0;
                let pb = o.lbsProc > 0 ? (o.b / o.lbsProc) * 100 : 0;
                let pc = o.lbsProc > 0 ? (o.c / o.lbsProc) * 100 : 0;
                let pr = o.lbsProc > 0 ? (o.rej / o.lbsProc) * 100 : 0;
                
                let totalPct = pa + pb + pc + pr;
                if(totalPct > 100) { pa = (pa/totalPct)*100; pb = (pb/totalPct)*100; pc = (pc/totalPct)*100; pr = (pr/totalPct)*100; }

                return { 
                    nombre: k, lotes: o.lotes, lbs: o.lbsProc, 
                    fresco: o.lbsProc > 0 ? (o.fSum/o.lbsProc) : 0, 
                    pa: pa, pb: pb, pc: pc, pr: pr
                };
            }).sort((a,b)=> b.fresco - a.fresco);

            document.getElementById('tbody-ranking').innerHTML = rankArr.map((r, i) => `
                <tr class="hover:bg-slate-50">
                    <td><span class="bg-emerald-600 text-white rounded-full w-6 h-6 flex items-center justify-center font-bold text-xs">${i+1}</span></td>
                    <td class="font-bold">${r.nombre}</td>
                    <td>${r.lotes}</td>
                    <td class="font-mono">${r.lbs.toLocaleString('en-US', {maximumFractionDigits:0})} lb</td>
                    <td class="font-bold text-emerald-700">${r.fresco.toFixed(2)}%</td>
                    <td class="text-emerald-600 font-bold">${r.pa.toFixed(1)}%</td>
                    <td class="text-amber-500 font-bold">${r.pb.toFixed(1)}%</td>
                    <td class="text-rose-500 font-bold">${r.pc.toFixed(1)}%</td>
                    <td class="text-slate-600 font-bold">${r.pr.toFixed(1)}%</td>
                    <td class="w-32">
                        <div class="bar-composition">
                            <div class="bar-a" style="width: ${r.pa}%"></div>
                            <div class="bar-b" style="width: ${r.pb}%"></div>
                            <div class="bar-c" style="width: ${r.pc}%"></div>
                            <div class="bar-d" style="width: ${r.pr}%"></div>
                        </div>
                    </td>
                </tr>
            `).join('');

            // PESTAÑA 4: RAW DATA
            document.getElementById('tbody-raw').innerHTML = data.map(d => `
                <tr class="hover:bg-slate-50">
                    <td class="p-2 border font-mono font-bold">${d.Lote}</td>
                    <td class="p-2 border">${d.Camaronera_Oficial}</td>
                    <td class="p-2 border font-mono text-slate-500">${d.Libras_Recibidas.toLocaleString('en-US')}</td>
                    <td class="p-2 border font-mono font-bold">${d.Libras_Procesadas.toLocaleString('en-US')}</td>
                    <td class="p-2 border font-mono text-rose-600">${d.Rechazo.toLocaleString('en-US')}</td>
                    <td class="p-2 border font-mono text-emerald-600">${d.Clases.A.toLocaleString('en-US')}</td>
                    <td class="p-2 border font-black text-center">${d.Clase_Valida}</td>
                    <td class="p-2 border font-mono">${(d.Perc_Fresco||0).toFixed(1)}%</td>
                    <td class="p-2 border font-mono">${d.Gramaje_OC}</td>
                    <td class="p-2 border font-mono">${(d.Perc_Meta||0).toFixed(1)}</td>
                </tr>
            `).join('');
        }

        function filterTable() {
            let input = document.getElementById("searchData").value.toUpperCase();
            let trs = document.getElementById("rawTable").getElementsByTagName("tr");
            for (let i = 1; i < trs.length; i++) {
                let tdLote = trs[i].getElementsByTagName("td")[0];
                let tdProv = trs[i].getElementsByTagName("td")[1];
                if (tdLote || tdProv) {
                    let txt = (tdLote.textContent || tdLote.innerText) + " " + (tdProv.textContent || tdProv.innerText);
                    trs[i].style.display = txt.toUpperCase().indexOf(input) > -1 ? "" : "none";
                }       
            }
        }
        
        function exportToCSV() {
            let table = document.getElementById("rawTable");
            let rows = table.querySelectorAll("tr");
            let csv = [];
            for (let i = 0; i < rows.length; i++) {
                if(rows[i].style.display !== 'none') {
                    let row = [], cols = rows[i].querySelectorAll("td, th");
                    for (let j = 0; j < cols.length; j++) 
                        row.push('"' + cols[j].innerText.replace(/"/g, '""') + '"');
                    csv.push(row.join(","));
                }
            }
            let csvFile = new Blob([csv.join("\n")], {type: "text/csv"});
            let downloadLink = document.createElement("a");
            downloadLink.download = "datos_consolidados.csv";
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        fetchInitialData();
    </script>
