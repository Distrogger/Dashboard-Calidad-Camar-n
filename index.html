<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gerencial - Calidad y Rendimiento</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse para leer CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { border-bottom: 2px solid #0f172a; color: #0f172a; font-weight: 600; }
        .gerencial-table th { background-color: #1e293b; color: white; padding: 12px; text-align: left; font-size: 0.85rem; text-transform: uppercase; }
        .gerencial-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        .badge-green { background-color: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 9999px; font-weight: 600; font-size: 0.8rem; }
        .badge-yellow { background-color: #fef08a; color: #854d0e; padding: 4px 8px; border-radius: 9999px; font-weight: 600; font-size: 0.8rem; }
        .badge-red { background-color: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 9999px; font-weight: 600; font-size: 0.8rem; }
        .bar-composition { display: flex; height: 12px; border-radius: 6px; overflow: hidden; width: 100%; min-width: 100px; background-color: #e2e8f0;}
        .bar-a { background-color: #10b981; }
        .bar-b { background-color: #f59e0b; }
        .bar-c { background-color: #ef4444; }
        .bar-d { background-color: #1e293b; }
    </style>
</head>
<body class="text-slate-800">

    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Análisis de Calidad y Rendimiento Industrial</h1>
            <p class="text-sm text-slate-500">Integración: Liquidación (OMIPROD), Defectos y Organoléptico</p>
        </div>
        <div class="flex items-center gap-4">
            <label class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-md cursor-pointer text-sm transition font-semibold">
                <i class="fa-solid fa-upload mr-2"></i> Cargar CSVs Locales
                <input type="file" id="fileInput" multiple accept=".csv" class="hidden">
            </label>
            <span id="status-indicator" class="text-xs font-semibold px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full">Esperando Datos...</span>
        </div>
    </header>

    <nav class="bg-white px-6 border-b border-slate-200 overflow-x-auto">
        <ul class="flex gap-6 text-sm text-slate-500 min-w-max">
            <li><button class="tab-btn active py-4 hover:text-slate-800 transition" onclick="openTab(event, 'tab1')">1. Rendimiento Industrial y Rechazo</button></li>
            <li><button class="tab-btn py-4 hover:text-slate-800 transition" onclick="openTab(event, 'tab2')">2. Matriz Organoléptica</button></li>
            <li><button class="tab-btn py-4 hover:text-slate-800 transition" onclick="openTab(event, 'tab3')">3. Ranking de Proveedores</button></li>
            <li><button class="tab-btn py-4 hover:text-slate-800 transition" onclick="openTab(event, 'tab4')">4. Sábana Consolidada</button></li>
        </ul>
    </nav>

    <main class="p-6 max-w-7xl mx-auto">
        
        <!-- PESTAÑA 1 -->
        <section id="tab1" class="tab-content active">
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                 <div class="w-full md:w-1/4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Filtrar por Camaronera</label>
                    <select id="filterCamaronera" onchange="renderDashboard()"
